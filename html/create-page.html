<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create-page</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/create_events.css" />
  </head>
  <body>
    <div class="flexbox-container1">
      <div id="menu-bar" class="clearfix">
        <a href="../index.html">
          <button class="button yellow-button logo-tab"></button>
        </a>
        <a href="events-page.html">
          <button class="button tan-button events-tab">EVENTS</button>
        </a>
        <a href="create-page.html">
          <button class="button tan-button create-tab">CREATE</button>
        </a>
        <a href="rso-page.html">
          <button class="button tan-button rso-tab">RSO'S</button>
        </a>
        <button
          type="button"
          class="button yellow-button login-tab user"
          id="login"
        >
          LOGIN
        </button>
        <button class="button tan-button join-tab user" id="signup">
          JOIN
        </button>
      </div>
    </div>
    <div class="form-div">
      <form action="signup" method="POST">
        <a href="create-page.html">
          <button
            type="button"
            class="button exit button"
            id="exit-button1"
          ></button>
        </a>
        <h3>SIGN UP</h3>
        <label for="username">Username</label><br />
        <input type="text" class="username" name="username" /><br />
        <label for="password">Password</label><br />
        <input type="password" class="password" name="password" /><br /><br />

        <div class="radio-text">
          <label for="user">User</label>
          <label for="rso">Admin</label>
          <label for="university">Super Admin</label>
          <input type="radio" id="user" name="role" value="user" />
          <input type="radio" id="rso" name="role" value="rso" />
          <input type="radio" id="university" name="role" value="university" />
        </div>
        <div id="userFields">
          <label for="name">Full Name:</label>
          <input type="text" id="name" name="name" /><br />
        </div>
        <div id="universityFields">
          <label for="loc_name">Location Name:</label><br />
          <input type="text" id="loc_name" name="loc_name" /><br />

          <label for="university_name">University Name:</label><br />
          <input
            type="text"
            id="university_name"
            name="university_name"
          /><br />

          <label for="university_desc">University Description:</label><br />
          <textarea id="university_desc" name="university_desc"></textarea
          ><br />

          <label for="num_students">Number of Students:</label><br />
          <input
            type="number"
            id="num_students"
            name="num_students"
            min="0"
          /><br />
        </div>
        <label for="school_email">School Email:</label><br />
        <input
          type="email"
          id="school_email"
          name="school_email"
          required
        /><br />
        <input type="submit" value="SIGN UP" />
      </form>
    </div>

    <div class="form-div">
      <form action="login" method="POST">
        <a href="create-page.html">
          <button
            type="button"
            class="button exit button"
            id="exit-button2"
          ></button>
        </a>
        <h3>LOGIN</h3>
        <label for="username">Username</label><br />
        <input type="text" class="username" name="username" /><br />
        <label for="school_email">School Email</label><br />
        <input type="text" class="school_email" name="school_email" /><br />
        <label for="password">Password</label><br />
        <input type="password" class="password" name="password" /><br /><br />
        <input type="submit" value="LOGIN" />
      </form>
    </div>
    <div class="flexbox-container2">
      <form id="Event_creation_box" action="create-Event" method="POST">
        <h3>Create Event</h3>
        <label for="event_title">Name of Event:</label>
        <input type="text" class="event_title" name="event_title" /><br />
        <div class="radio-text">
          <label for="public_event">Public Event</label>
          <label for="private_event">Private Event</label>
          <label for="rso_event">RSO Event</label>
          <input
            type="radio"
            id="public_event"
            name="event_type"
            value="public"
          />
          <input
            type="radio"
            id="private_event"
            name="event_type"
            value="private"
          />
          <input type="radio" id="rso_event" name="event_type" value="rso" />
        </div>
        <div class="event-date-container">
          <label for="event_date">Date of Event:</label>
          <select name="event_month" id="event_month">
            <option value="Jan">Jan</option>
            <option value="Feb">Feb</option>
            <option value="Mar">Mar</option>
            <option value="Apr">Apr</option>
            <option value="May">May</option>
            <option value="Jun">Jun</option>
            <option value="Jul">Jul</option>
            <option value="Aug">Aug</option>
            <option value="Sep">Sep</option>
            <option value="Oct">Oct</option>
            <option value="Nov">Nov</option>
            <option value="Dec">Dec</option>
          </select>
          <select name="event_day" id="event_day">
            <option value="01">01</option>
            <option value="02">02</option>
            <option value="03">03</option>
            <option value="04">04</option>
            <option value="05">05</option>
            <option value="06">06</option>
            <option value="07">07</option>
            <option value="08">08</option>
            <option value="09">09</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
            <option value="21">21</option>
            <option value="22">22</option>
            <option value="23">23</option>
            <option value="24">24</option>
            <option value="25">25</option>
            <option value="26">26</option>
            <option value="27">27</option>
            <option value="28">28</option>
            <option value="29">29</option>
            <option value="30">30</option>
            <option value="31">31</option>
          </select>
          <select name="event_year">
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
          </select>
        </div>
        <div class="event-time-container">
          <label for="event_time">Time of Event:</label>
          <input
            type="number"
            name="event_hour"
            id="event_hour"
            placeholder="Hour"
            min="1"
            max="12"
            <!--
            Updated
            max
            value
            for
            12-hour
            format
            --
          />

          <input
            type="number"
            name="event_minute"
            id="event_minute"
            placeholder="Minute"
            min="0"
            max="59"
            step="1"
            required
          />
          <!-- Dropdown for AM or PM -->
          <select name="event_ampm" id="event_ampm">
            <option value="AM">AM</option>
            <option value="PM">PM</option>
          </select>
        </div>
        <label for="event_desc">Description:</label>
        <textarea id="event_desc" name="event_desc"></textarea><br />
        <input type="submit" value="CREATE EVENT" />
      </form>
      <form id="RSO_creation_box" action="create-RSO" method="POST">
        <h3>Create RSO</h3>
        <label for="RSO_title">Name of RSO:</label>
        <input type="text" class="RSO_title" name="RSO_title" /><br />
        <label for="RSO_members">Members of RSO (Must have at least 4)</label>
        <textarea id="RSO_members" name="RSO_members"></textarea>
        <input type="submit" value="CREATE RSO" />
      </form>
    </div>
    <div class="form-div" id="account-box">
      <form action="account" method="GET">
        <h3>Account Details</h3>
        <br />
      </form>
    </div>
    <script src="../assets/main.js"></script>
    <script src="../assets/create_events.js"></script>
  </body>
</html>
